<script src="script.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  loadRecipes().then(recipes => {
    const recipe = recipes.find(r => r.id === id);
    renderDetail(recipe);
  });
</script>
